<svg xmlns="http://www.w3.org/2000/svg" width="880" height="292" viewBox="0 0 880 292" role="img" aria-labelledby="title desc">
  <title id="title">Background scaling comparison</title>
  <desc id="desc">The same 16:9 sample in four 4:3 frames: fill and crop, contain, centered square contain, and inner-circle contain with outer fill. Numbers match the documentation table.</desc>
  <defs>
    <g id="sample">
      <rect width="160" height="90" fill="#5fbcd3"/>
      <rect width="40" height="90" fill="#f5a65b"/>
      <rect x="120" width="40" height="90" fill="#a78bda"/>
      <path d="M0 70 L30 38 L60 68 L90 28 L130 66 L160 45 V90 H0Z" fill="#285f69"/>
      <circle cx="80" cy="25" r="10" fill="#fff2bc"/>
    </g>
    <clipPath id="frame"><rect width="200" height="150"/></clipPath>
    <clipPath id="inner"><circle cx="100" cy="75" r="56"/></clipPath>
  </defs>
  <rect width="880" height="292" rx="12" fill="#f6f7fa"/>
  <g transform="translate(360 12)"><use href="#sample"/></g>
  <g fill="#253448" font-family="sans-serif" font-size="18" text-anchor="middle">
    <text x="120" y="130">1</text><text x="333" y="130">2</text>
    <text x="546" y="130">3</text><text x="759" y="130">4</text>
  </g>
  <g transform="translate(20 139)">
    <g clip-path="url(#frame)"><rect width="200" height="150" fill="#dce2eb"/>
      <use href="#sample" transform="translate(-33.333 0) scale(1.666667)"/>
    </g>
    <rect width="200" height="150" fill="none" stroke="#778398"/>
  </g>
  <g transform="translate(233 139)">
    <g clip-path="url(#frame)"><rect width="200" height="150" fill="#dce2eb"/>
      <use href="#sample" transform="translate(0 18.75) scale(1.25)"/>
    </g>
    <rect width="200" height="150" fill="none" stroke="#778398"/>
  </g>
  <g transform="translate(446 139)">
    <g clip-path="url(#frame)"><rect width="200" height="150" fill="#dce2eb"/>
      <use href="#sample" transform="translate(25 32.8125) scale(0.9375)"/>
      <rect x="25" width="150" height="150" fill="none" stroke="#778398" stroke-dasharray="4 4"/>
    </g>
    <rect width="200" height="150" fill="none" stroke="#778398"/>
  </g>
  <g transform="translate(659 139)">
    <g clip-path="url(#frame)"><rect width="200" height="150" fill="#dce2eb"/>
      <use href="#sample" transform="translate(-33.333 0) scale(1.666667)"/>
      <g clip-path="url(#inner)"><use href="#sample" transform="translate(44 43.5) scale(0.7)"/></g>
      <circle cx="100" cy="75" r="56" fill="none" stroke="#fff" stroke-width="2"/>
    </g>
    <rect width="200" height="150" fill="none" stroke="#778398"/>
  </g>
</svg>
